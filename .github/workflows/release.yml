name: Release watch faces

# Tests, builds and packages both watch faces (Groundtrack and Groundtrack
# Fuller) on every change. A push to main
# releases a new version when package.json names one that has release notes
# (releases/vX.Y.Z.md) and no tag yet; a pushed version tag releases that tag.
# After Dymaxion's release workflow. See docs/RELEASING.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Also cover releases published manually. Releases created below with
  # GITHUB_TOKEN do not trigger a second workflow run.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish to Pebble again
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned build tools
        run: |
          npm ci
          pip install pebble-tool==5.0.40
          pebble sdk install 4.33.1
      - name: Tests
        run: npm test
      - name: Clean watch build and package
        run: |
          npm run build:native
          node tools/check-app-size.mjs
          node tools/check-stack.mjs
          python tools/release.py package
          python tools/release.py check
      - name: Decide whether this push is a release
        id: release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_EVENT_NAME" = release ]; then
            tag="$REQUESTED_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || [ ! -f "releases/$tag.md" ]; then
              tag=""
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release: ${tag:-none}"
      # Recovery uses the actual GitHub release downloads, so it verifies
      # and uploads exactly the packages users already have, not a rebuild.
      - name: Recover existing release packages
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir release-artifacts --pattern 'groundtrack-*.pbw' --pattern SHA256SUMS --clobber
          (cd release-artifacts && sha256sum --check SHA256SUMS)
      - name: Verify the release tag belongs to main
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python tools/release.py check --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: groundtrack-release
          path: release-artifacts/
          if-no-files-found: error

  publish:
    needs: verify
    if: needs.verify.outputs.tag != '' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pebble-store-publish
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      GROUNDTRACK_STORE_APP_ID: ${{ vars.GROUNDTRACK_STORE_APP_ID }}
      GROUNDTRACK_FULLER_STORE_APP_ID: ${{ vars.GROUNDTRACK_FULLER_STORE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name != 'push' && needs.verify.outputs.tag || github.sha }}
      - name: Require both store listings and publishing credentials
        env:
          PEBBLE_FIREBASE_REFRESH_TOKEN: ${{ secrets.PEBBLE_FIREBASE_REFRESH_TOKEN }}
        run: |
          for name in GROUNDTRACK_STORE_APP_ID GROUNDTRACK_FULLER_STORE_APP_ID PEBBLE_FIREBASE_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Store publishing requires $name. Configure the repository variable or secret before releasing."
              exit 1
            fi
          done
      # Tag the tested commit. A tag pushed with the workflow's own token starts
      # no new run, so this run publishes it. If the same tag was pushed by
      # hand meanwhile, carry on only when it names this commit.
      - name: Tag the release
        if: github.ref_type == 'branch' && github.event_name == 'push'
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" || [ "$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)" = "$GITHUB_SHA" ]
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: groundtrack-release
          path: release-artifacts
      - name: Publish the verified packages to Pebble
        env:
          PEBBLE_FIREBASE_REFRESH_TOKEN: ${{ secrets.PEBBLE_FIREBASE_REFRESH_TOKEN }}
        run: |
          pip install pebble-tool==5.0.40
          python tools/release.py publish --tag "$RELEASE_TAG"
      - name: Publish GitHub release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Groundtrack $RELEASE_TAG" --notes-file release-artifacts/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/groundtrack-enroute.pbw release-artifacts/groundtrack-fuller.pbw release-artifacts/SHA256SUMS --clobber
