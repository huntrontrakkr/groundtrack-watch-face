name: Verify concept
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: concept-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run measure
      - run: git diff --exit-code docs/trajectory-measurements.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: groundtrack-concept
          path: |
            dist/
            docs/trajectory-measurements.json
            docs/screenshots/
          retention-days: 14
