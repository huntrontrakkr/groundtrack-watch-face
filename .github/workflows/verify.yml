name: Verify concept
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: concept-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The core (the watch's code) as WebAssembly, for the study and its tests.
      - name: Install wasi-sdk and build the core
        run: |
          mkdir -p ~/.local/wasi && cd ~/.local/wasi
          curl -sL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz | tar xz
          cd "$GITHUB_WORKSPACE" && tools/build-core.sh
      - run: npm test
      - run: npm run measure
      - run: git diff --exit-code docs/trajectory-measurements.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: groundtrack-concept
          path: |
            dist/
            docs/trajectory-measurements.json
            docs/screenshots/
          retention-days: 14
